<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado de depósitos y crédito</title>
<style>
:root {
  color-scheme: light;
  --page: #f4f2ec; --surface: #fbfaf6; --surface-2: #efede6; --ink: #15191c; --ink-2: #4c524f;
  --muted: #858a84; --grid: #e3e1d8; --axis: #c4c2b8; --ring: rgba(21, 25, 28, 0.10);
  --s-bancos: #0a8a7a; --s-coops: #d4622a; --s-foco: #b0197e; --s-cuarto: #6b6fd1; --s-neutro: #a9a79f;
  --c1: #b0197e; --c2: #d4622a; --c3: #0a8a7a; --c4: #6b6fd1; --c5: #b38600; --c6: #2f78c4;
  --seq-0: #eaf3f0; --seq-1: #0a5c52; --bueno: #0c7a32; --malo: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f1214; --surface: #161a1d; --surface-2: #1f2427; --ink: #f3f1ea; --ink-2: #c3c6bf;
    --muted: #8b908a; --grid: #262b2e; --axis: #3a4044; --ring: rgba(255, 255, 255, 0.10);
    --s-bancos: #00a79f; --s-coops: #d9682f; --s-foco: #d6449f; --s-cuarto: #7f84e3; --s-neutro: #6d716d;
    --c1: #d6449f; --c2: #d9682f; --c3: #00a79f; --c4: #7f84e3; --c5: #b08a00; --c6: #3d8fe0;
    --seq-0: #1d2a29; --seq-1: #3fc2b0; --bueno: #3fbf6a; --malo: #f06a5f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f1214; --surface: #161a1d; --surface-2: #1f2427; --ink: #f3f1ea; --ink-2: #c3c6bf;
  --muted: #8b908a; --grid: #262b2e; --axis: #3a4044; --ring: rgba(255, 255, 255, 0.10);
  --s-bancos: #00a79f; --s-coops: #d9682f; --s-foco: #d6449f; --s-cuarto: #7f84e3; --s-neutro: #6d716d;
  --c1: #d6449f; --c2: #d9682f; --c3: #00a79f; --c4: #7f84e3; --c5: #b08a00; --c6: #3d8fe0;
  --seq-0: #1d2a29; --seq-1: #3fc2b0; --bueno: #3fbf6a; --malo: #f06a5f;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.lateral { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--grid); padding: 22px 14px; background: var(--page); }
.marca { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); padding: 0 10px 14px; }
.marca b { display: block; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--ink); margin-top: 4px; font-weight: 650; }
.capitulos { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.capitulos a { display: flex; gap: 10px; align-items: baseline; text-decoration: none; padding: 7px 10px; border-radius: 8px; color: var(--ink-2); font-size: 13.5px; }
.capitulos a .n { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; width: 18px; }
.capitulos a:hover { background: var(--surface-2); color: var(--ink); }
.capitulos a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 2px 0 0 var(--s-foco); font-weight: 600; }
.lateral .cortes { font-size: 12px; color: var(--muted); padding: 18px 10px 0; line-height: 1.6; }
.contenido { padding: 0 32px 80px; max-width: 1520px; width: 100%; }
@media (max-width: 920px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lateral { position: sticky; z-index: 6; height: auto; border-right: 0; border-bottom: 1px solid var(--grid); padding: 8px 12px; }
  .marca, .lateral .cortes { display: none; }
  .capitulos { display: flex; overflow-x: auto; scrollbar-width: none; }
  .capitulos a { white-space: nowrap; }
  .contenido { padding: 0 16px 80px; }
}
.pagina { padding-top: 34px; }
.pagina[hidden] { display: none; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(28px, 4.2vw, 42px); line-height: 1.1; margin: 8px 0 12px; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: clamp(22px, 3vw, 30px); line-height: 1.15; margin: 6px 0 10px; font-weight: 650; letter-spacing: -.005em; }
h3 { font-size: 15px; margin: 0 0 4px; font-weight: 620; }
.respuesta { font-size: 16.5px; color: var(--ink-2); max-width: 820px; margin: 0 0 20px; }
.respuesta b { color: var(--ink); font-weight: 620; }
.bloque { margin-top: 26px; }
.bloque > h3.titulo-bloque { font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
.tarjeta { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 18px 18px 14px; min-width: 0; }
.tarjeta .nota { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.tarjeta .sub { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
.rejilla { display: grid; gap: 16px; }
.r2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.r4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
/* gráfico + tabla: más ancho para la tabla y sin estirar la tarjeta del gráfico al alto de la tabla */
.gt { grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); align-items: start; }
.r2.arriba { align-items: start; }
@media (max-width: 1340px) { .gt { grid-template-columns: minmax(0, 1fr); } } /* en pantallas medianas la tabla no cabe al lado: va debajo, a todo el ancho */
@media (max-width: 860px) { .r2, .gt { grid-template-columns: minmax(0, 1fr); } .r4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.dato { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.dato .etq { font-size: 12.5px; color: var(--ink-2); }
.dato .val { font-size: 26px; font-weight: 620; margin-top: 2px; line-height: 1.15; }
.dato .sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.siguiente { margin-top: 40px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--grid); padding-top: 16px; }
.siguiente a { text-decoration: none; font-size: 14px; color: var(--ink-2); }
.siguiente a b { color: var(--ink); }
.siguiente a:hover b { text-decoration: underline; }
.filtros { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
.filtro { display: grid; gap: 4px; min-width: 0; }
.filtro > span { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.filtro select { background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 5px 8px; font-size: 13.5px; max-width: 240px; }
.seg { display: inline-flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font-size: 12.5px; padding: 4px 11px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.10); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--axis); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--axis); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-2); }
.chip[aria-pressed="true"] i { border-color: transparent; }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.rango { display: flex; align-items: center; gap: 10px; }
.rango input { width: 200px; accent-color: var(--s-foco); }
.rango output { font-weight: 620; font-variant-numeric: tabular-nums; min-width: 64px; }
.grafico { position: relative; width: 100%; }
.grafico svg { display: block; width: 100%; overflow: visible; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin: 2px 0 8px; }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 16px; height: 2px; border-radius: 2px; display: inline-block; }
.leyenda i.caja { width: 10px; height: 10px; border-radius: 3px; }
.leyenda i.punto { width: 10px; height: 10px; border-radius: 50%; }
.tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring); box-shadow: 0 6px 24px rgba(0,0,0,.14);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 150px; max-width: 280px; opacity: 0; transition: opacity .08s; z-index: 4; }
.tooltip .t { color: var(--muted); margin-bottom: 4px; }
.tooltip .f { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tooltip .f .k { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tooltip .f .k i { width: 12px; height: 2px; border-radius: 2px; }
.tooltip .f b { font-weight: 620; font-variant-numeric: tabular-nums; color: var(--ink); }
.vacio { color: var(--muted); font-size: 13.5px; padding: 30px 0; text-align: center; }
.tabla-env { overflow-x: auto; max-height: 520px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
th.ordenable { cursor: pointer; user-select: none; }
th.ordenable::after { content: " ↕"; color: var(--muted); font-size: 10px; }
th[aria-sort="ascending"]::after { content: " ↑"; color: var(--ink); }
th[aria-sort="descending"]::after { content: " ↓"; color: var(--ink); }
th[data-def] { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
td.largo { white-space: normal; min-width: 240px; max-width: 460px; line-height: 1.4; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.foco td { background: color-mix(in srgb, var(--s-foco) 9%, transparent); font-weight: 600; }
.pos { color: var(--bueno); } .neg { color: var(--malo); }
.portada { padding: 18px 0 8px; }
.bajada { color: var(--ink-2); max-width: 780px; font-size: 16.5px; margin: 0; }
.hallazgos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 22px; }
.hallazgo { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; }
.hallazgo .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hallazgo b { font-size: 15.5px; font-weight: 640; color: var(--ink); line-height: 1.3; }
.hallazgo p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.hallazgo .ir { margin-top: auto; font-size: 12.5px; color: var(--ink); padding-top: 6px; }
.hallazgo:hover { border-color: var(--axis); }
.hallazgo:hover .ir { text-decoration: underline; }
.guia { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; margin: 22px 0 0; }
.guia dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 8px 0 0; font-size: 13.5px; }
.guia dt { font-weight: 620; white-space: nowrap; } .guia dd { margin: 0; color: var(--ink-2); }
@media (max-width: 600px) { .guia dl { grid-template-columns: 1fr; } .guia dd { margin-bottom: 6px; } }
.accion { display: grid; gap: 12px; }
.accion article { background: var(--surface); border: 1px solid var(--ring); border-left: 3px solid var(--s-foco); border-radius: 10px; padding: 14px 16px; }
.accion article p { margin: 0; color: var(--ink-2); }
details { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 10px 14px; margin-top: 10px; }
details summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.refs li { margin-bottom: 6px; color: var(--ink-2); } .refs i { color: var(--ink); }
.buscador { width: 100%; max-width: 420px; font-size: 14px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); margin: 4px 0 14px; }
.glosario-grupo { margin-bottom: 16px; }
.glosario-grupo h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 8px; }
.glosario-grupo td { white-space: normal; vertical-align: top; }
.glosario-grupo td:first-child { font-weight: 620; width: 22%; } .glosario-grupo td:nth-child(2) { width: 36%; color: var(--ink-2); }
.boton { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--axis); border-radius: 8px; padding: 6px 12px; text-decoration: none; font-size: 13px; background: var(--surface); margin-top: 8px; }
.boton:hover { border-color: var(--ink-2); }
.pie { margin-top: 48px; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside class="lateral">
    <div class="marca">Sistema financiero del Ecuador<b>Mercado de depósitos y crédito</b></div>
    <nav aria-label="Capítulos"><ol class="capitulos" id="capitulos"></ol></nav>
    <div class="cortes" id="cortes"></div>
  </aside>
  <main class="contenido" id="contenido"></main>
</div>

<script id="datos" type="application/json">__DATOS__</script>
<script id="glosario-datos" type="application/json">__GLOSARIO__</script>
<script>
"use strict";
/* ================= Datos y utilidades ================= */
const R = JSON.parse(document.getElementById("datos").textContent);
const GLOS = JSON.parse(document.getElementById("glosario-datos").textContent);
const X = R.explorador, ENT = R.entidad, CAT = X.catalogo || {};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, text) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text !== undefined) e.textContent = text; return e; };
const svgEl = (tag, attrs = {}) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const nf = d => new Intl.NumberFormat("es-EC", { maximumFractionDigits: d, minimumFractionDigits: d });
const f0 = nf(0), f1 = nf(1), f2 = nf(2), f3 = nf(3);
const pct = (v, d = 1) => v == null || !isFinite(v) ? "—" : nf(d).format(v * 100) + " %";
const pp = (v, d = 1) => v == null || !isFinite(v) ? "—" : (v > 0 ? "+" : "") + nf(d).format(v) + " pp";

const usd = v => { if (v == null || !isFinite(v)) return "—"; const a = Math.abs(v), s = v < 0 ? "−" : ""; if (a >= 1e9) return s + "USD " + f1.format(a / 1e9) + " mil M"; if (a >= 1e6) return s + "USD " + f1.format(a / 1e6) + " M"; if (a >= 1e3) return s + "USD " + f0.format(a / 1e3) + " mil"; return s + "USD " + f0.format(a); };
const titulo = s => String(s ?? "").toLowerCase().replace(/(^|\s|\()\S/g, c => c.toUpperCase());
const NOMBRES = { "COOP SEGMENTO 1": "Coop. S1", "COOP SEGMENTO 2": "Coop. S2", "COOP SEGMENTO 3": "Coop. S3", "COOP SEGMENTO 4": "Coop. S4", "COOP SEGMENTO 5": "Coop. S5", "COOP SIN SEGMENTO": "Coop. sin seg.",
  "OTROS BANCOS": "Otros bancos", "GENERAL_RUMINAHUI": "Gral. Rumiñahui", "BANCO PRIVADO": "Bancos privados", "COOPERATIVA": "Cooperativas", "COOPERATIVAS": "Cooperativas",
  "MUTUALISTA": "Mutualistas", "BANCO PUBLICO": "Banca pública", "SOCIEDAD FINANCIERA": "Soc. financieras", "OTROS": "Mutualistas y públicos" };
const nom = c => NOMBRES[c] || (CAT[c] && CAT[c].nombre) || titulo(String(c).replace(/_/g, " "));
const amFecha = am => new Date(Math.floor(am / 100), am % 100, 0);
const amTxt = am => new Date(Math.floor(am / 100), am % 100 - 1, 1).toLocaleDateString("es-EC", { month: "long", year: "numeric" });
const mesTxt = d => (d instanceof Date ? d : new Date(d + "T00:00:00")).toLocaleDateString("es-EC", { month: "short", year: "numeric" });
const fechaTxt = s => s ? new Date(s + "T00:00:00").toLocaleDateString("es-EC", { day: "numeric", month: "short", year: "numeric" }) : "—";
const filas = c => { if (!c) return []; const ks = Object.keys(c), n = c[ks[0]].length, out = new Array(n); for (let i = 0; i < n; i++) { const o = {}; for (const k of ks) o[k] = c[k][i]; out[i] = o; } return out; };
const memo = f => { let v; return () => v ?? (v = f()); };
const unicos = a => [...new Set(a)];
const mediana = a => { const v = a.filter(x => x != null && isFinite(x)).sort((x, y) => x - y); return v.length ? (v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : null; };
function mezcla(a, b, t) { const h = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const A = h(a), B_ = h(b); return "rgb(" + A.map((v, i) => Math.round(v + (B_[i] - v) * t)).join(",") + ")"; }
function luminancia(rgb) { const [r, g, b] = rgb.match(/\d+/g).map(Number); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }

/* Colores: la entidad del plan siempre en magenta; el resto toma el primer color libre al
   seleccionarse y lo conserva mientras siga seleccionado (el color sigue a la entidad). */
class Paleta {
  constructor() { this.asig = new Map(); this.slots = ["--c2", "--c3", "--c4", "--c5", "--c6"]; }
  color(k) {
    if (k === ENT) return css("--s-foco");
    if (!this.asig.has(k)) { const usados = new Set(this.asig.values()); this.asig.set(k, this.slots.find(s => !usados.has(s)) || "--s-neutro"); }
    return css(this.asig.get(k));
  }
  sincronizar(sel) { for (const k of [...this.asig.keys()]) if (!sel.has(k)) this.asig.delete(k); }
}
const COLOR_TIPO = { "BANCO PRIVADO": "--s-bancos", "COOPERATIVA": "--s-coops", "MUTUALISTA": "--s-cuarto", "BANCO PUBLICO": "--s-neutro" };
const COLOR_CLUSTER = ["--c3", "--c2", "--c4", "--c5", "--c6", "--c1"];
const colorCluster = c => css(COLOR_CLUSTER[(c - 1) % COLOR_CLUSTER.length]);

const DEF = {};
for (const g of GLOS) for (const t of g.terminos) DEF[t.termino.toLowerCase()] = t;
const ALIAS = { "α tasa": "semi-elasticidad α", "σ nido": "σ (parámetro de nido)", "f 1.ª etapa": "f de primera etapa", "e.e.": "e.e. (error estándar)",
  "vida media": "vida media", "ajuste mensual": "ajuste mensual", "traspaso 3 m": "traspaso 3 m", "cartera/dep.": "cartera / depósitos", "roa": "roa", "roe": "roe",
  "morosidad": "morosidad (mora)", "mora": "morosidad (mora)", "costo fondeo": "costo de fondeo", "gasto op./activo": "gasto operativo / activo",
  "coop − banco": "diferencial coop − banco (spread)", "avance coop.": "avance de cooperativas (pp)", "a ≤ 1 pp del techo": "techo regulatorio (tasa máxima)", "techo": "techo regulatorio (tasa máxima)",
  "hhi": "hhi (índice de herfindahl-hirschman)", "cuota": "cuota de mercado", "cuota coop.": "cuota de mercado", "brecha": "brecha de penetración", "potencial": "potencial",
  "cuota objetivo": "cuota objetivo", "sube: auc sin": "auc", "baja: auc sin": "auc", "auc con": "auc", "efecto en cuota": "disciplina de mercado", "crec. 12 m": "crecimiento 12 m", "crec. dep.": "crecimiento anual compuesto" };
const definicion = label => { const k = String(label).toLowerCase(); const t = DEF[ALIAS[k] || k]; return t ? t.que_es + " " + t.como_se_lee : null; };

/* ================= Componentes ================= */
function tarjeta(padre, tituloTxt, subTxt, notaTxt) {
  const t = el("div", { class: "tarjeta" }), h = el("h3", {}, tituloTxt || "");
  t.append(h); if (subTxt) t.append(el("p", { class: "sub" }, subTxt));
  const ley = el("div", { class: "leyenda" }), g = el("div", { class: "grafico" }), nota = el("p", { class: "nota" }, notaTxt || "");
  t.append(ley, g, nota); padre.append(t);
  return { t, h, ley, g, nota };

    lineas(c1.g, series, { cero: vista === "monto" && !mora, fmtY: v => f0.format(v) + (vista === "monto" && !mora ? "" : " %"), fmtT: v => f1.format(v) + (vista === "monto" && !mora ? " mil M" : " %"), etiquetas: true, alto: 300 });
    const ult = ag.filter(a => a.am === ultimoAM), totU = ult.reduce((s, a) => s + (a[mora ? "cartera" : st.medida] || 0), 0);
    const banc = ult.find(a => a.t === "BANCO PRIVADO"), coop = ult.find(a => a.t === "COOPERATIVA");
    const yoy = t => { const a = ag.find(x => x.t === t && x.am === ultimoAM), b = ag.find(x => x.t === t && x.am === ultimoAM - 100), k = mora ? "cartera" : st.medida; return a && b && b[k] ? a[k] / b[k] - 1 : null; };
    datos(resumen, mora ? [["Morosidad bancos privados", pct(banc && valor(banc, "mora")), lugar + " · " + amTxt(ultimoAM)], ["Morosidad cooperativas", pct(coop && valor(coop, "mora")), lugar], ["Cartera del filtro", usd(totU), ""], ["Cuota coop. en cartera", pct(coop && totU ? coop.cartera / totU : null), ""]]

  }

    const tot = new Map(); for (const d of SP()) tot.set(d.anio_mes, (tot.get(d.anio_mes) || 0) + (d[med] || 0));
    const series = [...selE].map(k => {
      const pts = EM().filter(d => d.entidad_codigo === k).sort((a, b) => a.anio_mes - b.anio_mes), byAm = new Map(pts.map(x => [x.anio_mes, valor(x, st.medida)]));
      const data = pts.map(x => { const v = valor(x, st.medida); let y; if (mora) y = v * 100; else if (stE.vista === "monto") y = v / 1e6; else if (stE.vista === "cuota") y = v / tot.get(x.anio_mes) * 100; else { const b = byAm.get(x.anio_mes - 100); y = b ? (v / b - 1) * 100 : null; } return [amFecha(x.anio_mes), y]; });
      return { name: nom(k), color: palE.color(k), data, grosor: k === ENT ? 2.5 : 2 };
    });
    const monto = !mora && stE.vista === "monto";
    c2.h.textContent = `${MED.find(m => m[0] === st.medida)[1]} por entidad · ${mora ? "morosidad %" : monto ? "millones de USD" : stE.vista === "cuota" ? "cuota del sistema %" : "variación anual %"}`;

    lineas(c2.g, series, { fmtY: v => monto ? f0.format(v) : f1.format(v) + " %", fmtT: v => monto ? "USD " + f0.format(v) + " M" : f2.format(v) + " %", etiquetas: true, alto: 300 });
    const totU = tot.get(ultimoAM), tot12 = tot.get(ultimoAM - 100), porK = new Map(); for (const d of EM()) porK.set(d.entidad_codigo + "|" + d.anio_mes, d);

/* ---------- 02 Tasas ---------- */
RENDER.tasas = sec => {
  cabecera(sec, pag("tasas"), [`La tasa a plazo de los bancos grandes pasó de ${f1.format(bancosProm(piso))} % (${mesTxt(piso.fecha)}) a `, [f1.format(bancosProm(pico)) + " %"], ` (${mesTxt(pico.fecha)}) y hoy está en ${f1.format(bancosProm(ultTasa))} %. Las cooperativas S1 apenas se movieron (${f1.format(piso["COOP SEGMENTO 1"])} → ${f1.format(pico["COOP SEGMENTO 1"])} → ${f1.format(ultTasa["COOP SEGMENTO 1"])} %). En crédito, las tasas viven pegadas al techo regulatorio: cambia de producto para verlo.`]);
  const PROD = [["DEP", "Depósitos a plazo"], ["CONSUMO", "Consumo"], ["PRODUCTIVO", "Productivo"], ["MICROCRÉDITO", "Microcrédito"], ["INMOBILIARIO", "Inmobiliario"]];
  const st = { producto: "DEP", periodo: "2019", techo: true };
  const sel = new Set([ENT, "PICHINCHA", "PACIFICO", "PRODUBANCO", "COOP SEGMENTO 1"]), pal = new Paleta();
  const barra = barraFiltros(sec);
  filtro(barra, "Producto", segmentado(PROD, st.producto, v => { st.producto = v; armarChips(); pintar(); }));
  filtro(barra, "Período", segmentado(PERIODOS, st.periodo, v => { st.periodo = v; pintar(); }));
  filtro(barra, "Techo (crédito)", segmentado([["1", "Mostrar"], ["0", "Ocultar"]], "1", v => { st.techo = v === "1"; pintar(); }));
  const fChips = el("div"); filtro(barra, "Entidades y grupos (hasta 6)", fChips);

  const c = tarjeta(bloque(sec, ""), "", "", "");
  const extra = bloque(sec, "");
  const ORD = g => (g === ENT ? "0" : GRANDES.includes(g) ? "1" : g.startsWith("COOP") ? "3" : "2") + nom(g);
  const gruposDe = prod => prod === "DEP" ? Object.keys(X.tasas_pasivas).filter(k => k !== "mes") : unicos(TA().filter(d => d.segmento === prod).map(d => d.grupo));
  function armarChips() {
    const gs = gruposDe(st.producto).sort((a, b) => ORD(a).localeCompare(ORD(b)));
    for (const k of [...sel]) if (!gs.includes(k)) sel.delete(k);
    if (!sel.size) gs.slice(0, 3).forEach(g => sel.add(g));
    fChips.replaceChildren(chipsSel(gs.map(g => [g, nom(g)]), sel, pal, () => pintar()));
  }
  function pintar() {
    const desde = desdePeriodo(st.periodo), dep = st.producto === "DEP";
    const series = [...sel].map(k => ({ name: nom(k), color: pal.color(k), data: dep ? TP().map(d => [d.fecha, d[k]]) : TA().filter(d => d.grupo === k && d.segmento === st.producto).sort((a, b) => a.anio_mes - b.anio_mes).map(d => [amFecha(d.anio_mes), d.tasa]) }));
    if (!dep && st.techo) series.push({ name: "Techo regulatorio", color: css("--ink-2"), discontinua: true, grosor: 1.5, sinPunto: true, data: TECHO().filter(d => d.segmento === st.producto).sort((a, b) => a.anio_mes - b.anio_mes).map(d => [amFecha(d.anio_mes), d.techo]) });
    c.h.textContent = PROD.find(x => x[0] === st.producto)[1] + " · tasa efectiva anual %";
    c.nota.textContent = dep ? "Depósitos a plazo nuevos a mezcla de plazo constante (ajuste hedónico por banda de plazo), promedio mensual. Fuente: BCE semanal." : "Colocaciones nuevas del segmento, tasa ponderada por monto (sin ajuste por subsegmento). Techo: tasa máxima vigente ponderada por el monto del sistema en cada subsegmento. Fuente: BCE.";
    leyenda(c.ley, series);
    lineas(c.g, series, { xMin: desde, fmtY: v => f0.format(v) + " %", fmtT: v => f2.format(v) + " %", etiquetas: true, alto: 320 });
    const enRango = s => s.data.filter(d => d[1] != null && +d[0] >= +desde);
    datos(resumen, series.filter(s => s.name !== "Techo regulatorio").slice(0, 4).map(s => { const r = enRango(s); return [s.name, r.length ? f2.format(r.at(-1)[1]) + " %" : "—", r.length ? "cambio en el período: " + pp(r.at(-1)[1] - r[0][1], 2) : ""]; }));
    extra.replaceChildren();
    if (dep) {
      extra.append(el("h3", { class: "titulo-bloque" }, "Quién movió primero en el ciclo 2022–2025"));
      const ct = tarjeta(extra, "", "Barra llena: de la primera subida de 1 pp hasta el pico (círculo). Barra tenue: del pico hasta la primera baja de 1 pp. Pasa el cursor para ver las fechas.", "Media móvil de 8 semanas de la tasa a plazo ajustada.");
      lineaTiempo(ct.g, R.ciclo, ENT);
    } else {
      extra.append(el("h3", { class: "titulo-bloque" }, "Cuánto crédito se coloca pegado al techo (desde 2025)"));
      tabla(tablaEn(extra), [{ key: "segmento", label: "Segmento", fmt: titulo }, { key: "tipo_entidad", label: "Tipo", fmt: nom }, { key: "monto", label: "Monto", n: true, fmt: usd },
        { key: "tasa_ponderada", label: "Tasa", n: true, fmt: v => f2.format(v) + " %" }, { key: "techo_ponderado", label: "Techo", n: true, fmt: v => f2.format(v) + " %" }, { key: "cuota_a_1pp_del_techo", label: "A ≤ 1 pp del techo", n: true, fmt: v => pct(v, 0) }],
        R.techos.filter(d => d.monto > 2e8), { foco: f => f.segmento === st.producto });
    }

/* ---------- 03 Sustitución ---------- */

  const F = sust.flujos, S = sust.saldos;
  cabecera(sec, pag("sustitucion"), ["Por cada punto porcentual que las cooperativas S1 pagan por encima de los bancos, su cuota en las captaciones nuevas a plazo sube ", [f1.format(F.pp_cuota_por_pp_spread) + " pp"], `. En saldos el ajuste es lento (vida media de ${f0.format(S.vida_media_meses)} meses) y en el largo plazo suma ${f1.format(S.pp_largo_plazo_por_pp_spread)} pp, unos `, [usd(S.usd_largo_plazo_por_pp_spread)], ". Mueve el diferencial para ver cuánto dinero se desplaza."]);
  const SS = sust.serie.map(d => ({ ...d, fecha: new Date(d.mes + "T00:00:00") }));
  const actual = SS.at(-1).spread, cuotaSaldoAct = SS.filter(d => d.cuota_coop_saldo != null).at(-1).cuota_coop_saldo;
  const barra = barraFiltros(sec), out = el("div"); sec.append(out);
  const logistica = z => 1 / (1 + Math.exp(-z));
  const cuotaFlujo = sp => logistica(F.const + F.coef_spread * sp + F.coef_tendencia * F.tendencia_ultima);

    datos(out, [["Cuota coop. en captaciones nuevas", pct(cf1), `hoy (modelo): ${pct(cf0)} · cambio ${pp((cf1 - cf0) * 100)}`],
      ["Flujo mensual que se desplaza", usd((cf1 - cf0) * F.flujo_mensual_bancos_coops), `de ${usd(F.flujo_mensual_bancos_coops)} al mes captados por bancos + coops`],
      ["Cuota coop. de largo plazo en saldos", pct(lp1), `hoy observada ${pct(cuotaSaldoAct)} · equilibrio actual ${pct(lp0)}`],
      ["Saldo que migraría en el largo plazo", usd((lp1 - lp0) * S.mercado_plazo_usd), `la mitad en ≈ ${f0.format(S.vida_media_meses)} meses`]]);

  function pintar() {
    const desde = new Date(+st.periodo, 0, 1);
    lineas(g1.g, [{ name: "Diferencial", color: css("--s-coops"), data: SS.map(d => [d.fecha, d.spread]) }], { xMin: desde, cero: true, fmtY: v => f1.format(v), fmtT: v => pp(v, 2), alto: 240 });
    const sC = [{ name: "Flujos nuevos", color: css("--s-coops"), data: SS.map(d => [d.fecha, d.cuota_coop_flujo * 100]) }, { name: "Saldos", color: css("--s-bancos"), data: SS.map(d => [d.fecha, d.cuota_coop_saldo == null ? null : d.cuota_coop_saldo * 100]) }];
    leyenda(g2.ley, sC); lineas(g2.g, sC, { xMin: desde, fmtY: v => f0.format(v) + " %", fmtT: v => f1.format(v) + " %", alto: 240, etiquetas: true });

/* ---------- 04 Liderazgo ---------- */
RENDER.liderazgo = sec => {

  const r2 = el("div", { class: "rejilla gt" }); bloque(sec, "Velocidad y ciclo").append(r2);

    barras(b.g, G.map((g, j) => ({ g, v: MR.p[j][i] })).filter(x => x.v != null).sort((x, y) => y.v - x.v).map(x => ({ label: nom(x.g), value: x.v * 100, color: col(x.g), marca: MR.base[i] * 100, foco: x.g === ENT, tip: [{ name: `${nom(st.e)} lo sigue`, value: pct(x.v, 0) }, { name: `prob. base de ${nom(st.e)}`, value: pct(MR.base[i], 0) }] })), { fmt: v => f0.format(v) + " %", izq: 110 });

/* ---------- 05 Anticipar ---------- */

  const tt_ = tarjeta(bt, "", "", "");
  const bT = el("div", { class: "filtros" }); bT.style.cssText = "border:0;padding:0 0 6px;background:transparent;margin:0"; tt_.h.after(bT);

  const resT = el("p", { class: "sub" }); bT.after(resT);
  const fechaAM = am => new Date(Math.floor(am / 100), am % 100 - 1, 1);
  function tendencia(e, gana, dr, saldoAlc) {

    const ult = hist.at(-1), S0 = ult.dep_plazo, S12 = hist.at(-13).dep_plazo, g = Math.pow(S0 / S12, 1 / 12) - 1, f0d = fechaAM(ult.anio_mes);

  }

  const q = tarjeta(r, "Cambio en el flujo mensual de cada rival (millones de USD)", "", "Negativo: el rival pierde captación a favor de la entidad.");

      if (!enAlcance(c) || !c.total) return;
      const s = c.propio / c.total, D = 1 - s + s * g, ds = s * g / D - s, gC = c.total * ds;
      gana += gC; saldoAlc += c.saldo_plazo; propioAlc += c.propio;
      e.rivales[i].forEach((v, k) => { perdida[k] += v * (1 / D - 1); });
      porC.push({ canton: c.canton, provincia: c.provincia, total: c.total, cuota: s, cuota_nueva: s + ds, gana: gC, brecha: c.brecha_pp });
    });
    if (st.alcance === "pais") saldoAlc = e.saldo_plazo_total;
    const dr = st.dpp / 100, saldoExtra = gana * e.plazo_medio_dias / 30;
    const costo = (st.reprecio === "si" ? dr * saldoAlc : 0) + (e.tasa_actual / 100 + dr) * saldoExtra, cm = saldoExtra > 0 ? costo / saldoExtra : null;
    datos(out, [
      ["Flujo mensual adicional", usd(gana), propioAlc ? `${pct(gana / propioAlc)} sobre su captación de ${usd(propioAlc)} al mes en el alcance` : "sin captación en el alcance"],
      ["Saldo adicional (estado estable)", usd(saldoExtra), `plazo medio ${f0.format(e.plazo_medio_dias)} días`],
      [st.dpp >= 0 ? "Costo anual adicional" : "Ahorro anual de intereses", usd(Math.abs(costo)), st.reprecio === "si" ? `re-precia ${usd(saldoAlc)} de saldo` : "sin re-precio del saldo existente"],
      ["Costo marginal del fondeo nuevo", st.dpp > 0 && cm != null ? f1.format(cm * 100) + " %" : "—", `tasa actual ${f2.format(e.tasa_actual)} % · α ${f3.format(e.alpha)}`]]);
    barras(q.g, SIM.rivales.map((k, i) => ({ k, v: perdida[i] })).filter(x => x.k !== st.e && Math.abs(x.v) > 1).sort((a, b) => a.v - b.v).map(x => ({ label: nom(x.k), value: x.v / 1e6, color: x.k === "COOPERATIVAS" ? css("--s-coops") : x.k === "OTROS" ? css("--s-neutro") : x.k === ENT ? css("--s-foco") : css("--s-bancos"), tip: [{ name: "cambio mensual", value: usd(x.v) }, { name: "parte del total", value: pct(gana ? Math.abs(x.v / gana) : null, 0) }] })), { fmt: v => f2.format(v), izq: 120 });
    tabla(envC, [{ key: "canton", label: "Cantón", fmt: titulo }, { key: "provincia", label: "Provincia", fmt: titulo }, { key: "total", label: "Flujo del cantón", n: true, fmt: usd }, { key: "cuota", label: "Cuota", n: true, fmt: v => pct(v) }, { key: "cuota_nueva", label: "Cuota nueva", n: true, fmt: v => pct(v) },
      { key: "gana", label: "Cambio mensual", n: true, fmt: usd, clase: v => v > 0 ? "pos" : v < 0 ? "neg" : "" }, { key: "brecha", label: "Brecha", n: true, fmt: v => v == null ? "—" : pp(v) }], porC, { ordenable: true, orden: "gana", dir: st.dpp >= 0 ? -1 : 1 });
    tendencia(e, gana, dr, saldoAlc);
    nota.textContent = "Cómo se calcula: logit simple por cantón con flujo total fijo. Con g = e^(α·Δtasa), la cuota pasa de s a s·g/(1 − s + s·g) y cada rival se ajusta por 1/(1 − s + s·g). Flujos: promedio mensual de los últimos 6 meses (BCE). Saldo adicional = flujo adicional × plazo medio. Costo = subida × saldo re-preciado + (tasa + subida) × saldo adicional. Los flujos BCE incluyen renovaciones: la respuesta de clientes nuevos puede ser mayor que la estimada.";
  }
  calc();
};

RENDER.accion = sec => {
  const vp = acc.vs_pares || [], yo = vp.find(d => d.entidad_codigo === ENT) || {}, otros = vp.filter(d => d.entidad_codigo !== ENT), med = k => mediana(otros.map(d => d[k]));
  cabecera(sec, pag("accion"), [`${ent} es el segundo banco del país, con el `, ["mejor ROA de su grupo de pares"], " y crecimiento de cartera por encima de ellos. Su espacio de crecimiento está menos en precio y más en geografía, en la calidad de su cartera y en cómo y cuándo mueve sus tasas."]);
  const k = el("div"); sec.append(k);
  datos(k, [["ROA", pct(yo.roa, 2), "pares: " + pct(med("roa"), 2)], ["Morosidad", pct(yo.morosidad, 1), "pares: " + pct(med("morosidad"), 1)], ["Costo de fondeo", pct(yo.costo_fondeo, 1), "pares: " + pct(med("costo_fondeo"), 1)], ["Crecimiento cartera 12 m", pct(yo.crec_cartera_12m, 0), "pares: " + pct(med("crec_cartera_12m"), 0)]]);
  const sim25 = acc.simulacion.escenarios["25"], ceE = R.correccion_error.find(d => d.grupo === ENT), PR = R.anticipacion.prediccion, predE = PR.find(x => x.banco === ENT);
  const sh = senalHoy();
  const losiguen = Object.entries(acc.lo_siguen || {}).filter(([c]) => !c.startsWith("COOP")).sort((a, b) => b[1] - a[1]);
  const opD = acc.oportunidades.depositos.top, opC = acc.oportunidades.cartera.top;
  const costaF = opD.filter(d => d.region === "COSTA" && d.presente && d.brecha_pp >= 2).slice(0, 4), sierra = opD.filter(d => d.region === "SIERRA" && d.presente).slice(0, 4).map(d => titulo(d.canton)), ausente = opC.filter(d => !d.presente).slice(0, 5).map(d => titulo(d.canton));
  const recos = [
    ["1. No subir la tasa de forma general: pagar por dinero nuevo, no por el que ya está.", `Con su elasticidad (α ${f3.format(acc.simulacion.alpha)}), +0,25 pp de tasa en todo el país atraen ≈ ${usd(sim25.gana_mensual_usd)} al mes y suman ≈ ${usd(sim25.saldo_adicional_usd)} de saldo, pero re-precian ${usd(acc.simulacion.saldo_plazo_actual)}: el fondeo incremental cuesta ≈ ${f0.format(sim25.costo_marginal_pct)} % anual. Una tasa preferencial solo para dinero nuevo cuesta ≈ ${f1.format(acc.simulacion.tasa_actual + 0.25)} %.`, "#/simulador?e=" + ENT, "Probar en el simulador"],
    ["2. Defender cuota en la Costa, donde rinde por debajo de su propia marca.", `${costaF.map(d => titulo(d.canton)).join(", ")}: su cuota de depósitos está entre ${pct(Math.min(...costaF.map(d => d.cuota)), 0)} y ${pct(Math.max(...costaF.map(d => d.cuota)), 0)} frente a ≈ ${pct(costaF[0]?.cuota_objetivo, 0)} en plazas costeñas parecidas. Prioridad comercial y de cobertura (agencias, corresponsales, banca digital).`, "#/cantones", "Ver cantones"],
    ["3. Sierra media y cantones sin presencia en crédito.", `En ${sierra.join(", ")} la brecha es de 2–4 pp. En cartera, cantones donde no coloca y sus pares sí: ${ausente.join(", ")}.`, "#/cantones", "Ver oportunidades"],
    ["4. Moverse con el ciclo, no contra él: vigilar a los líderes.", `${ent} ajusta rápido a sus pares (vida media ${f1.format(ceE.vida_media)} meses). Cuando mueve primero, ${losiguen.slice(0, 3).map(([c, v]) => nom(c) + " " + pct(v, 0)).join(", ")} lo acompañan. Hoy domina la señal de ${sh.sustantivo}: mayor probabilidad para ${sh.texto}; ${ent} tiene ${pct(predE?.[sh.k], 0)}. ${sh.dir === "baja" ? "Si ellos recortan, sostener la tasa unas semanas capta el flujo que se mueve." : "Si el mercado sube detrás del líder, decidir rápido si acompañar: quedarse atrás cuesta flujo nuevo, y subir con premio solo para dinero nuevo limita el costo."}`, "#/anticipar", "Ver anticipación"],
    ["5. La calidad de cartera es parte del precio del fondeo.", `Mora de ${pct(yo.morosidad, 1)} contra ${pct(med("morosidad"), 1)} de sus pares. Cada punto de mora equivale a ≈ ${f2.format(acc.mora_equivalente_pp)} pp de tasa en la captación; un deterioro de 1 pp costaría ≈ ${usd(acc.simulacion.flujo_mensual_base * -d1disc.coeficientes.morosidad_bancos)} al mes de captación nueva.`, "#/demanda", "Ver disciplina de mercado"],
    ["6. Vigilar el diferencial con las cooperativas S1.", `Hoy pagan ≈ ${f1.format(ultTasa["COOP SEGMENTO 1"] - ultTasa[ENT])} pp más que ${ent}. Cada punto adicional lleva ≈ ${f1.format(sust.flujos.pp_cuota_por_pp_spread)} pp de los flujos a plazo hacia ellas. En mercados cooperativos, producto de ahorro o plazo con tasa competitiva solo para dinero nuevo.`, "#/sustitucion", "Mover el diferencial"],
  ];
  const ac = el("div", { class: "accion" }); ac.style.marginTop = "16px";
  for (const [t, d, h, l] of recos) { const a = el("article"); a.append(el("h3", {}, t), el("p", {}, d), el("a", { href: h, class: "boton" }, l + " →")); ac.append(a); }
  sec.append(ac);
  const envP = tablaEn(bloque(sec, "Comparación"), "Frente a sus pares más cercanos", "Pares por distancia en variables de modelo de negocio. Ordena con clic.");
  tabla(envP, [{ key: "entidad_codigo", label: "Entidad", fmt: nom }, { key: "roa", label: "ROA", n: true, fmt: v => pct(v, 2) }, { key: "roe", label: "ROE", n: true, fmt: v => pct(v, 1) }, { key: "morosidad", label: "Morosidad", n: true, fmt: v => pct(v, 1) }, { key: "gasto_operativo_activo", label: "Gasto op./activo", n: true, fmt: v => pct(v, 1) },
    { key: "costo_fondeo", label: "Costo fondeo", n: true, fmt: v => pct(v, 1) }, { key: "crec_cartera_12m", label: "Crec. 12 m", n: true, fmt: v => pct(v, 0) }, { key: "crec_depositos_12m", label: "Crec. dep. 12 m", n: true, fmt: v => pct(v, 0) }], [yo, ...otros], { ordenable: true, foco: f => f.entidad_codigo === ENT });
};

/* ---------- 11 Método ---------- */
RENDER.metodo = sec => {
  cabecera(sec, pag("metodo"), ["Qué datos se usan, cómo se construye cada modelo y qué puede fallar. Método completo y referencias en docs/analisis_mercado.md del repo."]);
  const conc = R.conciliacion.map(c => `${nom(c.tipo_entidad)} ${c.medida} ${pct(c.diferencia_agregada_pct / 100, 1)}`).join(" · ");
  const bloques = [
    ["Datos y reglas de lectura", [`Saldos por cantón: CAPCOL (Superbancos) y SEPS, enero 2021 – ${amTxt(R.cortes.saldos)}. Excluye entidades de segundo piso. Los depósitos se registran en el cantón de la agencia: Quito y Guayaquil concentran depósitos corporativos.`, "Flujos y tasas: BCE semanal, tasas ponderadas por monto. Los totales nacionales incluyen operaciones sin cantón; los modelos por cantón las excluyen.", "Balances: Boletín Superbancos y EEFF SEPS. ROA = utilidad anualizada / activo promedio del año; morosidad = cartera improductiva / cartera bruta.", `Conciliación del corte (saldos por cantón vs. balance): ${conc}.`]],
    ["Qué puede fallar en cada modelo", ["Sustitución agregada: forma reducida; el diferencial sube cuando los bancos necesitan liquidez, así que mezcla la respuesta del ahorrista con el ciclo.", "Demanda por cantón: el instrumento supone que los shocks locales no son nacionales. Los flujos incluyen renovaciones: la elasticidad de clientes nuevos es probablemente mayor. σ ≈ 0, por eso el simulador usa logit simple.", "Simulador: usa el promedio de 6 meses por cantón; las cifras pueden diferir levemente de las del plan de acción, que simula mes a mes.", "Balance: rezagado 1 mes por publicación (robustez 3); banca pública y cooperativas S4–S5 sin balance. Solvencia = patrimonio / activo; su coeficiente negativo es mecánica contable.", "Liderazgo: precedencia temporal, no causalidad.", "Anticipación: AUC ≈ 0,7–0,76; sin variables externas (tasas de EE. UU., riesgo país).", "Oportunidades: brecha frente al propio desempeño en mercados parecidos; no usan población ni costos de expansión.", "Clusters: los cantones forman un continuo (silueta ≈ 0,25)."]],
  ];
  for (const [t, items] of bloques) { const d = el("details", { open: "" }), ul = el("ul"); d.append(el("summary", {}, t)); for (const i of items) ul.append(el("li", {}, i)); d.append(ul); sec.append(d); }
  const REFS = [["Berry, S. (1994).", "Estimating discrete-choice models of product differentiation.", "RAND Journal of Economics, 25(2)."], ["Berry, S., Levinsohn, J. y Pakes, A. (1995).", "Automobile prices in market equilibrium.", "Econometrica, 63(4)."], ["Nevo, A. (2001).", "Measuring market power in the ready-to-eat cereal industry.", "Econometrica, 69(2)."],
    ["Dick, A. (2008).", "Demand estimation and consumer welfare in the banking industry.", "Journal of Banking & Finance, 32(8)."], ["Adams, R., Brevoort, K. y Kiser, E. (2007).", "Who competes with whom? The case of depository institutions.", "Journal of Industrial Economics, 55(1)."], ["Hannan, T. (2003).", "The impact of credit unions on the rates offered for retail deposits by banks and thrift institutions.", "Federal Reserve, FEDS 2003-06."],
    ["Egan, M., Hortaçsu, A. y Matvos, G. (2017).", "Deposit competition and financial fragility.", "American Economic Review, 107(1)."], ["Drechsler, I., Savov, A. y Schnabl, P. (2017).", "The deposits channel of monetary policy.", "Quarterly Journal of Economics, 132(4)."], ["De Graeve, F., De Jonghe, O. y Vander Vennet, R. (2007).", "Competition, transmission and bank pricing policies.", "Journal of Banking & Finance, 31(1)."],
    ["Gambacorta, L. (2008).", "How do banks set interest rates?", "European Economic Review, 52(5)."], ["Hannan, T. y Berger, A. (1991).", "The rigidity of prices: evidence from the banking industry.", "American Economic Review, 81(4)."], ["Martínez Pería, M. S. y Schmukler, S. (2001).", "Do depositors punish banks for bad behavior?", "Journal of Finance, 56(3)."],
    ["Roengpitya, R., Tarashev, N. y Tsatsaronis, K. (2014).", "Bank business models.", "BIS Quarterly Review, diciembre."], ["Amel, D. y Rhoades, S. (1988).", "Strategic groups in banking.", "Review of Economics and Statistics, 70(4)."], ["Nguyen, H.-L. Q. (2019).", "Are credit markets still local?", "AEJ: Applied Economics, 11(1)."],
    ["Klein, M. (1971).", "A theory of the banking firm.", "Journal of Money, Credit and Banking, 3(2)."], ["Maimbo, S. y Henriquez Gallegos, C. (2014).", "Interest rate caps around the world.", "World Bank Policy Research WP 7070."]];
  const d = el("details"), ol = el("ol", { class: "refs" }); d.append(el("summary", {}, "Referencias académicas"));
  for (const [a, t, j] of REFS) { const li = el("li"); li.append(document.createTextNode(a + " "), el("i", {}, t), document.createTextNode(" " + j)); ol.append(li); }
  d.append(ol); sec.append(d);
  sec.append(el("p", { class: "pie" }, "Generado por scripts/analisis_mercado.py + scripts/informe_mercado.py (repo benchmark-bancos-analisis) sobre el data mart marts.*. Datos embebidos; no requiere conexión."));
};

/* ---------- 12 Glosario ---------- */
RENDER.glosario = sec => {
  cabecera(sec, pag("glosario"), ["Qué es cada término, unidad e indicador y cómo se lee. Fuente: docs/glosario_analisis.md."]);
  const inp = el("input", { class: "buscador", type: "search", placeholder: "Buscar término (p. ej. AUC, mora, pp)", "aria-label": "Buscar en el glosario" }), cuerpo = el("div"); sec.append(inp, cuerpo);
  const pintar = f => { f = f.trim().toLowerCase(); cuerpo.replaceChildren(); for (const g of GLOS) { const fl = g.terminos.filter(t => !f || (t.termino + " " + t.que_es + " " + t.como_se_lee).toLowerCase().includes(f)); if (!fl.length) continue; const b = el("div", { class: "glosario-grupo tarjeta" }), env = el("div", { class: "tabla-env" }); b.append(el("h3", {}, g.grupo), env); tabla(env, [{ key: "termino", label: "Término" }, { key: "que_es", label: "Qué es" }, { key: "como_se_lee", label: "Cómo se lee" }], fl); cuerpo.append(b); } if (!cuerpo.children.length) cuerpo.append(el("p", { class: "respuesta" }, "Ningún término coincide con la búsqueda.")); };
  inp.addEventListener("input", () => pintar(inp.value)); pintar("");
};

/* ================= Navegación ================= */
const contenido = $("contenido"), nav = $("capitulos");
for (const p of PAGINAS) {
  const li = el("li"), a = el("a", { href: "#/" + p.id }); a.append(el("span", { class: "n" }, p.n), document.createTextNode(p.t)); li.append(a); nav.append(li);
  const s = el("section", { class: "pagina", id: "p-" + p.id }); s.hidden = true; contenido.append(s);
}
for (const [k, v] of [["Saldos", amTxt(R.cortes.saldos)], ["Tasas BCE", fechaTxt(R.cortes.tasas_semana)], ["Balances", amTxt(R.cortes.balance)]]) { const d = el("div"); d.append(document.createTextNode(k + ": "), el("b", {}, v)); $("cortes").append(d); }
function ir() {
  const id = location.hash.replace(/^#\//, "").split("?")[0] || "inicio", p = pag(id) || PAGINAS[0];
  for (const x of PAGINAS) $("p-" + x.id).hidden = x.id !== p.id;
  nav.querySelectorAll("a").forEach(a => a.getAttribute("href") === "#/" + p.id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const s = $("p-" + p.id);
  if (!pintada[p.id] || p.id === "simulador") {
    s.replaceChildren();
    try { RENDER[p.id](s); if (p.id !== "inicio") pie(s, p); } catch (e) { s.append(el("p", { class: "respuesta" }, "No se pudo dibujar esta página: " + e.message)); console.error(e); }
    pintada[p.id] = true;
  } else s.querySelectorAll(".grafico").forEach(g => g._redibujar && g._redibujar());
  document.title = (p.id === "inicio" ? "" : p.t + " · ") + "Mercado de depósitos y crédito";
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", ir);
ir();
</script>
