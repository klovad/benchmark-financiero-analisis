[project]
name = "benchmark-analisis"
version = "0.1.0"
description = "Análisis del sistema financiero de Ecuador sobre el data mart de benchmark-bancos (solo lectura de marts.*)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=16.0",
    "psycopg[binary]>=3.1,<4",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    "openpyxl>=3.1",
    "statsmodels>=0.15.0",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
    "linearmodels>=7.0",
    "lightgbm>=4.7.0",
    "lifelines>=0.30.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_analisis"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
